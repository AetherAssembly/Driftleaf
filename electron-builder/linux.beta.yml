appId: org.aetherassembly.driftleaf.beta
productName: Driftleaf-Beta
icon: build/icon.png
artifactName: driftleaf-beta-${version}-${arch}.${ext}
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
asarUnpack:
  - node_modules/better-sqlite3/**/*.node
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Office
  synopsis: So your thoughts don't drift.
  executableName: driftleaf
  syncDesktopName: true
  desktop:
    entry:
      Name: Driftleaf (Beta)
deb:
  packageName: driftleaf-beta
  synopsis: So your thoughts don't drift.
rpm:
  packageName: driftleaf-beta
  description: So your thoughts don't drift.
publish:
  provider: github
  owner: AetherAssembly
  repo: Driftleaf
  channel: beta
generateUpdatesFilesForAllChannels: true
