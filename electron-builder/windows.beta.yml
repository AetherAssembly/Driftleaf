appId: org.aetherassembly.driftleaf.beta
productName: Driftleaf Beta
icon: build/icon.png
copyright: Copyright 2026 AetherAssembly
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - dist-electron/**
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true
  installerSidebar: assets/installer-sidebar.png
  license: assets/eula.rtf
  copyright: Copyright 2026 AetherAssembly
  include: build/installer.nsh
  artifactName: 'driftleaf-beta-setup-${version}.exe'
portable:
  artifactName: 'driftleaf-beta-portable-${version}.exe'
publish:
  provider: github
  owner: AetherAssembly
  repo: Driftleaf
  channel: beta
generateUpdatesFilesForAllChannels: true
