appId: org.aetherassembly.driftleaf
productName: Driftleaf
icon: build/icon.png
artifactName: driftleaf-${version}-${arch}.${ext}
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Office
  synopsis: So your thoughts don't drift.
  executableName: driftleaf
  syncDesktopName: true
  desktop:
    entry:
      Name: Driftleaf
deb:
  packageName: driftleaf
rpm:
  packageName: driftleaf
publish:
  provider: github
  owner: AetherAssembly
  repo: Driftleaf
generateUpdatesFilesForAllChannels: true
