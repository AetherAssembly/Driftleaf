appId: org.aetherassembly.driftleaf
productName: Driftleaf
icon: build/icon.png
artifactName: driftleaf-${version}-${arch}.${ext}
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
asarUnpack:
  - node_modules/better-sqlite3/**/*.node
linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Office
  synopsis: So your thoughts don't drift.
  executableName: driftleaf
  syncDesktopName: true
  desktop:
    entry:
      Name: Driftleaf
deb:
  packageName: driftleaf
  synopsis: So your thoughts don't drift.
rpm:
  packageName: driftleaf
  description: So your thoughts don't drift.
publish:
  provider: github
  owner: AetherAssembly
  repo: Driftleaf
  channel: stable
generateUpdatesFilesForAllChannels: true
