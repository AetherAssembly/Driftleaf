appId: org.aetherassembly.driftleaf.beta
productName: Driftleaf Beta
icon: build/icon.png
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - '!node_modules/better-sqlite3/deps/**'
  - '!node_modules/better-sqlite3/src/**'
asarUnpack:
  - node_modules/better-sqlite3/**/*.node
artifactName: 'driftleaf-beta-${version}-mac.${ext}'
mac:
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  minimumSystemVersion: '12.0'
dmg:
  title: Driftleaf Beta
  window:
    width: 540
    height: 380
  license: assets/eula.rtf
publish:
  provider: github
  owner: AetherAssembly
  repo: Driftleaf
  channel: beta
generateUpdatesFilesForAllChannels: true
