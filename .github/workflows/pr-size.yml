name: Label pull request size

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Calculate and apply size label
        uses: actions/github-script@v7
        with:
          script: |
            const labels = ['size: XS', 'size: S', 'size: M', 'size: L', 'size: XL'];
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100
            });
            const changedLines = files.reduce((total, file) => total + file.additions + file.deletions, 0);
            const size = changedLines < 10 ? 'size: XS'
              : changedLines < 50 ? 'size: S'
              : changedLines < 250 ? 'size: M'
              : changedLines < 500 ? 'size: L'
              : 'size: XL';
            const current = context.payload.pull_request.labels.map(label => label.name);
            const remove = current.filter(label => labels.includes(label));
            for (const label of remove) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: label
              });
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [size]
            });
            core.info(`Applied ${size} for ${changedLines} changed lines.`);name: PR size check