name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: Lint & build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # crates/driftleaf-core is a plain Rust crate (no windowing/GTK dependency), so this
      # runs on every platform in the matrix without the Linux WebKitGTK setup the
      # src-tauri build (tested separately in tauri-release.yml) needs.
      - name: Rust storage-compatibility tests
        run: npm run test:rust-compat

      - name: Build
        run: npm run build
