name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.6.0 or v0.6.0-beta.1
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      is_beta: ${{ steps.channel.outputs.is_beta }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract tag name
        id: tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Detect channel
        id: channel
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          TAG="$RELEASE_TAG"
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ steps.channel.outputs.is_beta }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release create "${{ steps.tag.outputs.tag }}" \
            --draft \
            --title "Driftleaf ${{ steps.tag.outputs.tag }}" \
            --notes "Release in progress..." \
            $PRERELEASE_FLAG

  build:
    name: Build & upload (${{ matrix.os }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm,appimage
          - os: ubuntu-24.04-arm
            bundles: deb,rpm,appimage
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: nsis

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
          registry-url: https://npm.pkg.github.com

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set package version from release tag
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        shell: bash
        run: node scripts/tauri/version.mjs "${TAG#v}" --allow-same

      - name: Package
        env:
          DRIFTLEAF_MAC_AUTO_UPDATE: ${{ vars.DRIFTLEAF_MAC_AUTO_UPDATE }}
          # Empty/unset until an updater signing key and feed are provisioned — the
          # build then simply reports updates as manual, same as every build so far.
          DRIFTLEAF_UPDATER_PUBLIC_KEY: ${{ vars.DRIFTLEAF_UPDATER_PUBLIC_KEY }}
          DRIFTLEAF_UPDATER_ENDPOINT: ${{ vars.DRIFTLEAF_UPDATER_ENDPOINT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run package:tauri -- --bundles ${{ matrix.bundles }}

      - name: Build update-manifest fragment
        # `createUpdaterArtifacts` signs every bundle format this job built (.deb.sig,
        # .rpm.sig, ...), not just one — Tauri's CLI never assembles a latest.json itself
        # (confirmed by inspecting a real build's output). The updater only ever fetches
        # one artifact per OS: the AppImage on Linux, the NSIS installer on Windows, the
        # app.tar.gz on macOS. Pick that one signed artifact and write this job's single
        # platform entry; publish-release merges every job's fragment into one real
        # latest.json once all of them have finished. A no-op if createUpdaterArtifacts
        # is off (no .sig files exist yet).
        shell: bash
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          python3 << 'PYEOF'
          import glob, json, os, subprocess
          from datetime import datetime, timezone

          priority = [".AppImage", ".app.tar.gz", ".exe", ".msi"]
          sigs = glob.glob("src-tauri/target/release/bundle/**/*.sig", recursive=True)
          chosen = None
          for suffix in priority:
              for sig in sigs:
                  if sig[: -len(".sig")].endswith(suffix):
                      chosen = sig
                      break
              if chosen:
                  break

          if not chosen:
              print("No updater-relevant signed artifact found; skipping manifest fragment.")
          else:
              artifact = chosen[: -len(".sig")]
              signature = open(chosen).read().strip()
              host = next(
                  line for line in subprocess.run(
                      ["rustc", "-vV"], capture_output=True, text=True
                  ).stdout.splitlines()
                  if line.startswith("host:")
              ).split()[1]
              arch = host.split("-")[0]
              os_name = "darwin" if "apple" in host else "windows" if "windows" in host else "linux"
              platform = f"{os_name}-{arch}"
              tag = os.environ["TAG"]
              manifest = {
                  "version": tag.lstrip("v"),
                  "notes": "",
                  "pub_date": datetime.now(timezone.utc).isoformat(),
                  "platforms": {
                      platform: {
                          "signature": signature,
                          "url": f"https://github.com/AetherAssembly/Driftleaf/releases/download/{tag}/{os.path.basename(artifact)}",
                      }
                  },
              }
              out = f"src-tauri/target/release/bundle/latest-{platform}.json"
              with open(out, "w") as f:
                  json.dump(manifest, f, indent=2)
              print(f"Wrote {out} for platform {platform} from {artifact}")
          PYEOF

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        shell: bash
        run: |
          find src-tauri/target/release/bundle -type f \( \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.rpm" -o \
            -name "*.dmg" -o \
            -name "*.exe" -o \
            -name "*.sig" -o \
            -name "latest-*.json" \
          \) | sort | while read -r f; do
            echo "Uploading $f..."
            gh release upload "$TAG" "$f" --clobber
          done

  publish-release:
    name: Publish release
    needs: [create-release, build]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          gh release download "$TAG" --dir ./artifacts

      - name: Merge per-platform update manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          python3 << 'PYEOF'
          import glob, json

          parts = sorted(glob.glob("./artifacts/latest-*.json"))
          if parts:
              merged = None
              for path in parts:
                  with open(path) as f:
                      data = json.load(f)
                  if merged is None:
                      merged = {
                          "version": data["version"],
                          "notes": data.get("notes", ""),
                          "pub_date": data["pub_date"],
                          "platforms": {},
                      }
                  merged["platforms"].update(data.get("platforms", {}))
              with open("./artifacts/latest.json", "w") as f:
                  json.dump(merged, f, indent=2)
              print(f"Merged {len(parts)} platform manifest(s) into latest.json")
          else:
              print("No per-platform latest.json files found — updater artifacts weren't built this release.")
          PYEOF

          if [[ -f ./artifacts/latest.json ]]; then
            gh release upload "$TAG" ./artifacts/latest.json --clobber
            for f in ./artifacts/latest-*.json; do
              gh release delete-asset "$TAG" "$(basename "$f")" --yes || true
            done
          fi

      - name: Build release notes
        run: |
          TAG="${{ needs.create-release.outputs.tag }}"
          VER="${TAG#v}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          IS_BETA="${{ needs.create-release.outputs.is_beta }}"
          export TAG VER PREV_TAG IS_BETA
          python3 << 'PYEOF'
          import os, re, hashlib, glob
          from pathlib import Path

          tag      = os.environ['TAG']
          ver      = os.environ['VER']
          prev_tag = os.environ.get('PREV_TAG', '').strip()
          artifacts_dir = Path('./artifacts')
          base_url = f"https://github.com/AetherAssembly/Driftleaf/releases/download/{tag}"

          # --- Parse CHANGELOG for this version ---
          changelog = Path('CHANGELOG.md').read_text()
          section_m = re.search(
              r'## \[' + re.escape(ver) + r'\].*?\n(.*?)(?=\n---\n|\n## \[|\Z)',
              changelog, re.DOTALL
          )
          section = section_m.group(1).strip() if section_m else ''

          def subsection(text, heading):
              m = re.search(r'### ' + heading + r'\n(.*?)(?=\n### |\Z)', text, re.DOTALL)
              return m.group(1).strip() if m else ''

          added   = subsection(section, 'Added')
          fixed   = subsection(section, 'Fixed')
          changed = subsection(section, 'Changed')

          # --- SHA256 helpers ---
          def sha256(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(65536), b''):
                      h.update(chunk)
              return h.hexdigest()

          def find_one(*patterns):
              for pat in patterns:
                  matches = sorted(glob.glob(str(artifacts_dir / pat)))
                  if matches:
                      return Path(matches[0])
              return None

          def row(label, path):
              if not path or not path.exists():
                  return None
              url = f"{base_url}/{path.name}"
              return f"| {label} | [{path.name}]({url}) | `{sha256(path)}` |"

          table_rows = list(filter(None, [
              row("Linux (x64) AppImage",   find_one("*amd64.AppImage")),
              row("Linux (x64) .deb",       find_one("*amd64.deb")),
              row("Linux (x64) .rpm",       find_one("*x86_64.rpm")),
              row("Linux (arm64) AppImage", find_one("*arm64.AppImage", "*aarch64.AppImage")),
              row("Linux (arm64) .deb",     find_one("*arm64.deb")),
              row("Linux (arm64) .rpm",     find_one("*aarch64.rpm")),
              row("macOS DMG",              find_one("*.dmg")),
              row("Windows installer",      find_one("*setup*.exe", "*-installer.exe")),
          ]))

          compare_link = (
              f"https://github.com/AetherAssembly/Driftleaf/compare/{prev_tag}...{tag}"
              if prev_tag else
              f"https://github.com/AetherAssembly/Driftleaf/releases/tag/{tag}"
          )

          # --- Assemble body ---
          is_beta = os.environ.get('IS_BETA', 'false') == 'true'

          parts = [f"## Driftleaf: {tag}", ""]

          if is_beta:
              parts += [
                  "> [!WARNING]",
                  "> **This is a beta release** and may contain bugs. It is intended for testing only.",
                  "> Install the [latest stable release](https://github.com/AetherAssembly/Driftleaf/releases/latest) for everyday use.",
                  "",
              ]

          if added:
              parts += ["### What's new", "", added, ""]
          if fixed:
              parts += ["### Bug fixes", "", fixed, ""]
          if changed:
              parts += ["### Changes", "", changed, ""]

          parts += [
              "---", "",
              "### Downloads", "",
              "| Platform | Format | SHA256 |",
              "|---|---|---|",
              *table_rows, "",
              "#### Verify a download", "",
              "```bash",
              f'sha256sum "Driftleaf_{ver}_amd64.AppImage"',
              "```", "",
              "---", "",
              "### Linux notes", "",
              "**Already using a package repo?** Just run your normal update command — no download needed:", "",
              "- **Debian / Ubuntu / Raspberry Pi OS (apt):** `sudo apt update && sudo apt upgrade driftleaf`",
              "- **Fedora / RHEL / CentOS Stream / Rocky / Alma (COPR):** `sudo dnf upgrade driftleaf`",
              "- **openSUSE (OBS):** `sudo zypper update driftleaf`",
              "- **Arch (AUR):** `paru -S driftleaf-bin` or `yay -S driftleaf-bin`",
              "- **Arch (AppImage):** download the appropriate `.AppImage` attached below, make it executable, and run it directly.",
              "",
              "**First install or using AppImage?** Grab your build from the table above.",
              "Repo setup instructions are in the [README](https://github.com/AetherAssembly/Driftleaf#download).", "",
              "### macOS notes", "",
              "The app is not notarized, so macOS may show a **\"damaged\"** warning and refuse to open it.",
              "Run this command after mounting the DMG to strip the quarantine flag:", "",
              "```sh",
              f"xattr -d com.apple.quarantine \"/Applications/Driftleaf.app\"",
              "```", "",
              "### Windows notes", "",
              "If SmartScreen warns on the installer, click **More info** then **Run anyway**."
              " The app is not yet code-signed.", "",
              "---", "",
              "### Full changelog", "",
              f"<!-- {compare_link} -->",
          ]

          Path('release-body.md').write_text('\n'.join(parts))
          print("release-body.md written")
          PYEOF

      - name: Publish release with notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG=""
          if [[ "${{ needs.create-release.outputs.is_beta }}" == "true" ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release edit "${GITHUB_REF#refs/tags/}" \
            --notes-file release-body.md \
            --draft=false \
            $PRERELEASE_FLAG
