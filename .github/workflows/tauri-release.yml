name: Tauri release packages
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
          registry-url: https://npm.pkg.github.com
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - run: npm ci --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - run: npm run test:rust-compat
      - run: npm run typecheck
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build unsigned release artifacts (no publication)
        run: npm run package:tauri -- --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v7
        with:
          name: driftleaf-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
