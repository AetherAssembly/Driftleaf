name: Build release artifacts

# Dev-build packaging (PLAN.md milestone 5): unsigned electron-builder artifacts for
# Linux/macOS/Windows, produced only for tagged releases cut from main or dev — not on
# every push, to keep the artifact history clean. Code signing/notarization is RC-phase
# work (milestone 14), not handled here. Per-platform electron-builder configs and the
# package:*/package:*:beta script split mirror Before-Its-Gone's build process.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-alpha-[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-beta-[0-9]+"

jobs:
  # Tags aren't "on" a branch, so this checks the tagged commit is actually reachable from
  # main or dev before spending matrix build time on it.
  verify-branch:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
      is_beta: ${{ steps.channel.outputs.is_beta }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          git fetch origin main dev 2>/dev/null || true
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main 2>/dev/null \
            || git merge-base --is-ancestor "$GITHUB_SHA" origin/dev 2>/dev/null; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::error::Tag $GITHUB_REF_NAME does not point at a commit on main or dev; skipping build."
          fi
      - id: channel
        run: |
          if [[ "$GITHUB_REF_NAME" == *-beta-* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: verify-branch
    if: needs.verify-branch.outputs.allowed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: linux
            package_script: ${{ needs.verify-branch.outputs.is_beta == 'true' && 'package:linux:beta' || 'package:linux' }}
          - os: macos-13
            artifact: macos
            package_script: ${{ needs.verify-branch.outputs.is_beta == 'true' && 'package:macos:beta' || 'package:macos' }}
          - os: windows-2022
            artifact: windows
            package_script: ${{ needs.verify-branch.outputs.is_beta == 'true' && 'package:windows:beta' || 'package:windows' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # @aetherAssembly/ui is published to GitHub Packages (see .npmrc); a PAT with
      # read:packages scope must be stored as the PACKAGES_TOKEN repo secret.
      - name: Configure GitHub Packages auth
        shell: bash
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_TOKEN }}" >> .npmrc

      - run: npm ci

      - run: npm run typecheck

      - name: Package (unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npm run ${{ matrix.package_script }}

      - uses: actions/upload-artifact@v4
        with:
          name: driftleaf-${{ matrix.artifact }}-${{ github.ref_name }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.dmg
            release/*.exe
            release/*.zip
            release/latest*.yml
          if-no-files-found: ignore
