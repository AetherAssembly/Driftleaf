<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src ipc: http://ipc.localhost; frame-src 'none'; worker-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Driftleaf extension</title></head><body>
<script>
(() => {
  const invoke = window.__TAURI_INTERNALS__.invoke;
  const call = (method, args = []) => invoke('extension_call', { method, args });
  Object.defineProperty(window, 'driftleafExtension', { value: Object.freeze({
    listNotes: () => call('listNotes'), readNote: id => call('readNote', [id]),
    graph: () => call('graph'), listDatabases: () => call('listDatabases'),
    readDatabase: id => call('readDatabase', [id])
  }) });
  invoke('extension_bootstrap').then(source => {
    const script = document.createElement('script');
    script.textContent = source;
    document.body.appendChild(script);
  }).catch(() => { document.body.textContent = 'This extension session is no longer available.'; });
})();
</script></body></html>
